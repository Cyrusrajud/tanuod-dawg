<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Information</title><link rel="stylesheet" href="css/style.css"></head><body>
<div id="nav"></div>
<div class="container"><h1 id="heading">Enter your information</h1><p class="sub">Fields with * are required.</p><div id="errors"></div>
<div class="box"><h2>Personal information</h2><div class="g2">
<div><label>Full name *</label><input id="full_name"></div><div><label>Professional title</label><input id="title" placeholder="e.g. Web Developer"></div>
<div><label>Email *</label><input id="email" type="email"></div><div><label>Contact number</label><input id="phone"></div></div>
<label>Address</label><input id="address"><label>About me *</label><textarea id="about" rows="4"></textarea>
<label>Profile picture</label><input type="file" id="photo" accept="image/*"><img id="photoPrev" alt=""></div>
<div class="box"><h2>Skills</h2><label>Separate with commas *</label><input id="skills" placeholder="HTML, CSS, JavaScript"></div>
<div class="box"><h2>Education</h2><div id="education"></div><button class="btn sm ghost" onclick="addRow('education')">+ Add education</button></div>
<div class="box"><h2>Work experience</h2><div id="experience"></div><button class="btn sm ghost" onclick="addRow('experience')">+ Add experience</button></div>
<div class="box"><h2>Projects</h2><div id="projects"></div><button class="btn sm ghost" onclick="addRow('projects')">+ Add project</button></div>
<div class="box"><h2>Social media / website links</h2><div class="g2">
<div><label>Facebook</label><input id="facebook" placeholder="https://..."></div><div><label>LinkedIn</label><input id="linkedin" placeholder="https://..."></div>
<div><label>GitHub</label><input id="github" placeholder="https://..."></div><div><label>Website</label><input id="website" placeholder="https://..."></div></div></div>
<button class="btn" id="saveBtn" onclick="save()">Save &amp; Choose Template</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/db.js"></script><script src="js/nav.js"></script><script src="js/create.js"></script></body></html>
